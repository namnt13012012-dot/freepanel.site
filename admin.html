<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị — Tạo Khóa Kích Hoạt</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Roboto', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e1b4b 100%);
            overflow-x: hidden;
            color: #e0e7ff;
        }
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        .star {
            position: absolute; border-radius: 50%; background: white;
            animation: twinkle var(--dur) ease-in-out infinite;
        }
        @keyframes twinkle {
            0%,100% { opacity: var(--op); }
            50% { opacity: 1; }
        }
        .page { position: relative; z-index: 1; }
        header {
            max-width: 800px; margin: 0 auto; padding: 24px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(129,140,248,0.15);
        }
        .back-link {
            color: #a5b4fc; text-decoration: none; font-size: 14px;
            transition: color 0.2s;
        }
        .back-link:hover { color: #e0e7ff; }
        main { max-width: 800px; margin: 0 auto; padding: 40px 24px; }
        .card {
            background: rgba(15,23,42,0.75); border-radius: 20px; padding: 36px;
            border: 1px solid rgba(129,140,248,0.2);
            backdrop-filter: blur(15px);
            box-shadow: 0 0 50px rgba(99,102,241,0.1);
        }
        .card h2 {
            font-size: 22px; margin-bottom: 28px;
            background: linear-gradient(90deg, #a5b4fc, #f472b6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .form-group { margin-bottom: 24px; }
        label {
            display: block; margin-bottom: 8px; font-size: 14px;
            color: #c7d2fe;
        }
        input, select {
            width: 100%; padding: 12px 16px; border-radius: 10px;
            border: 1px solid rgba(129,140,248,0.25);
            background: rgba(17,24,39,0.6); color: #e0e7ff;
            font-size: 14px; outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: #8b5cf6; }
        .btn-generate {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99,102,241,0.35);
        }
        .result {
            margin-top: 28px; padding: 20px;
            background: rgba(16,185,129,0.08);
            border: 1px solid rgba(16,185,129,0.25);
            border-radius: 12px; display: none;
        }
        .result.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .key-display {
            margin-top: 12px; padding: 14px;
            background: rgba(0,0,0,0.3); border-radius: 8px;
            font-family: 'Consolas', monospace; font-size: 15px;
            color: #34d399; word-break: break-all;
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
        }
        .copy-btn {
            padding: 6px 12px; background: rgba(139,92,246,0.3);
            border: none; border-radius: 6px; color: white;
            cursor: pointer; font-size: 12px; flex-shrink: 0;
        }
        .copy-btn:hover { background: rgba(139,92,246,0.5); }
        .history { margin-top: 32px; }
        .history h3 {
            font-size: 16px; margin-bottom: 16px; color: #a5b4fc;
        }
        .history-item {
            padding: 12px; border-bottom: 1px solid rgba(100,116,139,0.15);
            font-size: 13px;
        }
        .history-item:last-child { border-bottom: none; }
        .history-key { color: #34d399; font-family: monospace; }
        .history-meta { color: #94a3b8; margin-top: 4px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="stars" id="starsContainer"></div>

    <div class="page">
        <header>
            <h2>⚙️ Quản Trị — Tạo Khóa</h2>
            <a href="index.html" class="back-link">← Trở Về Trang Chủ</a>
        </header>

        <main>
            <div class="card">
                <h2>🔑 Tạo Khóa Kích Hoạt Mới</h2>

                <div class="form-group">
                    <label for="duration">Thời hạn hiệu lực</label>
                    <select id="duration">
                        <option value="1h">1 Giờ</option>
                        <option value="6h">6 Giờ</option>
                        <option value="1d" selected>1 Ngày</option>
                        <option value="7d">7 Ngày</option>
                        <option value="30d">30 Ngày</option>
                        <option value="forever">Vĩnh Viễn</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quota">Giới hạn lượt sử dụng</label>
                    <select id="quota">
                        <option value="1">1 Lần</option>
                        <option value="5">5 Lần</option>
                        <option value="10" selected>10 Lần</option>
                        <option value="100">100 Lần</option>
                        <option value="unlimited">Không giới hạn</option>
                    </select>
                </div>

                <button class="btn-generate" onclick="generateKey()">✨ Tạo Khóa Ngay</button>

                <div class="result" id="resultBox">
                    <strong>✅ Khóa đã tạo thành công!</strong>
                    <div class="key-display" id="keyDisplay">
                        <span id="keyText"></span>
                        <button class="copy-btn" onclick="copyKey()">Sao Chép</button>
                    </div>
                </div>

                <div class="history" id="historySection" style="display:none;">
                    <h3>📋 Khóa Đã Tạo</h3>
                    <div id="historyList"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Tạo hiệu ứng sao
        const container = document.getElementById('starsContainer');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const s = Math.random() * 2.5 + 0.5;
            star.style.width = star.style.height = s + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--op', Math.random() * 0.5 + 0.2);
            star.style.setProperty('--dur', (Math.random() * 3 + 2) + 's');
            container.appendChild(star);
        }

        // Tạo khóa ngẫu nhiên
        function generateRandomString(len) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let res = '';
            for (let i = 0; i < len; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return res;
        }

        // Lấy thời gian hết hạn
        function getExpiryTime(duration) {
            const now = new Date();
            switch(duration) {
                case '1h': return new Date(now.getTime() + 60*60*1000);
                case '6h': return new Date(now.getTime() + 6*60*60*1000);
                case '1d': return new Date(now.getTime() + 24*60*60*1000);
                case '7d': return new Date(now.getTime() + 7*24*60*60*1000);
                case '30d': return new Date(now.getTime() + 30*24*60*60*1000);
                case 'forever': return null;
            }
        }

        // Tạo khóa chính
        function generateKey() {
            const duration = document.getElementById('duration').value;
            const quota = document.getElementById('quota').value;
            const keyPart = generateRandomString(24);
            const timestamp = Date.now().toString(36);
            const checksum = generateRandomString(8);
            
            const fullKey = `COSMIC-${keyPart}-${timestamp}-${checksum}`;
            
            // Hiển thị kết quả
            document.getElementById('keyText').textContent = fullKey;
            document.getElementById('resultBox').classList.add('show');
            
            // Lưu vào lịch sử
            saveToHistory(fullKey, duration, quota);
        }

        // Sao chép khóa
        function copyKey() {
            const keyText = document.getElementById('keyText').textContent;
            navigator.clipboard.writeText(keyText).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = 'Đã Sao Chép!';
                setTimeout(() => btn.textContent = 'Sao Chép', 2000);
            });
        }

        // Lịch sử tạo khóa
        let keyHistory = JSON.parse(localStorage.getItem('cosmicKeyHistory') || '[]');
        
        function saveToHistory(key, duration, quota) {
            const record = {
                key,
                duration,
                quota,
                createdAt: new Date().toLocaleString('vi-VN')
            };
            keyHistory.unshift(record);
            if (keyHistory.length > 10) keyHistory.pop();
            localStorage.setItem('cosmicKeyHistory', JSON.stringify(keyHistory));
            renderHistory();
        }

        function renderHistory() {
            if (keyHistory.length === 0) return;
            document.getElementById('historySection').style.display = 'block';
            const list = document.getElementById('historyList');
            list.innerHTML = keyHistory.map(item => `
                <div class="history-item">
                    <div class="history-key">${item.key}</div>
                    <div class="history-meta">
                        Hạn: ${item.duration} • Giới hạn: ${item.quota === 'unlimited' ? 'Không' : item.quota} lượt • ${item.createdAt}
                    </div>
                </div>
            `).join('');
        }

        // Khởi tạo hiển thị lịch sử khi tải trang
        renderHistory();
    </script>
</body>
</html>

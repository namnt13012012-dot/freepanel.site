<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị — CosmicKey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e1b4b 100%);
            overflow-x: hidden;
            color: #e0e7ff;
        }

        /* ===== Nền Sao & Mây Thiên Hà ===== */
        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        .star {
            position: absolute;
            border-radius: 50%;
            background: white;
            animation: twinkle var(--dur) ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: var(--op); }
            50% { opacity: 1; }
        }
        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.2;
            pointer-events: none;
        }
        .neb-a {
            top: -100px; right: -50px;
            width: 500px; height: 500px;
            background: radial-gradient(circle, #8b5cf6, transparent 70%);
            animation: drift 25s ease-in-out infinite;
        }
        .neb-b {
            bottom: -100px; left: -50px;
            width: 450px; height: 450px;
            background: radial-gradient(circle, #ec4899, transparent 70%);
            animation: drift2 30s ease-in-out infinite;
        }
        @keyframes drift {
            0%,100% { transform: translate(0,0); }
            50% { transform: translate(-30px, 40px); }
        }
        @keyframes drift2 {
            0%,100% { transform: translate(0,0); }
            50% { transform: translate(40px, -30px); }
        }

        .page { position: relative; z-index: 1; }

        /* ===== Header ===== */
        header {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(129, 140, 248, 0.15);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 42px; height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            display: grid; place-items: center;
            font-size: 20px;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }
        .logo-text h3 {
            font-size: 16px;
            background: linear-gradient(90deg, #a5b4fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-text p {
            font-size: 10px;
            color: #94a3b8;
        }
        .back-link {
            padding: 10px 22px;
            border: 1px solid rgba(129, 140, 248, 0.25);
            color: #c7d2fe;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .back-link:hover {
            border-color: #818cf8;
            background: rgba(129, 140, 248, 0.1);
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.15);
        }

        /* ===== Khối Chung ===== */
        main {
            max-width: 720px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .panel {
            background: rgba(15, 23, 42, 0.75);
            border-radius: 24px;
            padding: 42px;
            border: 1px solid rgba(129, 140, 248, 0.2);
            backdrop-filter: blur(15px);
            box-shadow: 
                0 0 50px rgba(99, 102, 241, 0.1),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .panel-header {
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(129, 140, 248, 0.15);
        }
        .panel-header h1 {
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .panel-header h1 span {
            background: linear-gradient(90deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .panel-header p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }

        /* ===== Form Đăng Nhập ===== */
        .auth-panel {
            max-width: 420px;
            margin: 80px auto;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #c7d2fe;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(129, 140, 248, 0.2);
            border-radius: 10px;
            color: #e0e7ff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15), 0 0 15px rgba(129, 140, 248, 0.1);
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899, #f59e0b);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.3);
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(139, 92, 246, 0.4), 0 0 60px rgba(236, 72, 153, 0.2);
        }
        .error-msg {
            color: #f87171;
            margin-top: 14px;
            font-size: 14px;
            display: none;
        }

        /* ===== Form Tạo Khóa ===== */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        @media (max-width: 560px) {
            .form-row { grid-template-columns: 1fr; }
        }
        select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(129, 140, 248, 0.2);
            border-radius: 10px;
            color: #e0e7ff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        select:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
        }
        .result-box {
            margin-top: 30px;
            padding: 24px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.25);
            border-radius: 14px;
            display: none;
            animation: fadeIn 0.5s ease;
        }
        .result-box.show { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-box h4 {
            color: #6ee7b7;
            margin-bottom: 12px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .key-display {
            background: rgba(0,0,0,0.3);
            padding: 14px 18px;
            border-radius: 10px;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            color: #a7f3d0;
            word-break: break-all;
            margin-bottom: 12px;
            border: 1px solid rgba(74, 222, 128, 0.15);
        }
        .copy-btn {
            padding: 10px 24px;
            background: rgba(255,255,255,0.08);
            color: #c7d2fe;
            border: 1px solid rgba(199, 210, 254, 0.2);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: #c7d2fe;
        }
        .hidden { display: none !important; }
        .logout-btn {
            margin-top: 20px;
            padding: 10px 24px;
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.25);
        }
    </style>
</head>
<body>
    <div class="stars" id="starsContainer"></div>
    <div class="nebula neb-a"></div>
    <div class="nebula neb-b"></div>

    <div class="page">
        <!-- ===== Màn Hình Đăng Nhập ===== -->
        <div id="loginSection">
            <main class="auth-panel">
                <div class="panel">
                    <div class="panel-header" style="text-align:center;">
                        <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;">
                            <div class="logo-icon">✨</div>
                            <div>
                                <h3 style="font-size:20px;background:linear-gradient(90deg,#a5b4fc,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">CosmicKey</h3>
                                <p style="font-size:12px;color:#94a3b8;">Bảng Điều Khiển Vũ Trụ — Đăng Nhập</p>
                            </div>
                        </div>
                    </div>

                    <form id="loginForm">
                        <div class="form-group">
                            <label>Tên Người Dùng</label>
                            <input type="text" id="username" placeholder="Nhập tên tài khoản" required>
                        </div>
                        <div class="form-group">
                            <label>Mật Khẩu</label>
                            <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                        </div>
                        <button type="submit" class="submit-btn">🔐 Đăng Nhập Hệ Thống</button>
                        <div class="error-msg" id="loginError">Tên đăng nhập hoặc mật khẩu không đúng!</div>
                    </form>
                </div>
            </main>
        </div>

        <!-- ===== Màn Hình Quản Trị (Sau Đăng Nhập) ===== -->
        <div id="adminSection" class="hidden">
            <header>
                <div class="logo">
                    <div class="logo-icon">🌌</div>
                    <div>
                        <h3>CosmicKey</h3>
                        <p>Bảng Điều Khiển Vũ Trụ</p>
                    </div>
                </div>
                <div style="display:flex;gap:12px;align-items:center;">
                    <a href="index.html" class="back-link">← Trở Về Trang Chủ</a>
                    <button class="logout-btn" onclick="logout()">🚪 Đăng Xuất</button>
                </div>
            </header>

            <main>
                <div class="panel">
                    <div class="panel-header">
                        <h1><span>🌌</span> Tạo Khóa Truy Cập Mới</h1>
                        <p>Thiết lập thông số → tạo khóa → phân phối cho người dùng</p>
                    </div>

                    <form id="keyForm">
                        <div class="form-group">
                            <label>Tên / Ghi Chú Nhận Diện</label>
                            <input type="text" id="desc" placeholder="VD: Key Mod Game — Thành viên Alpha" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Ngày Hết Hạn</label>
                                <input type="date" id="expDate">
                            </div>
                            <div class="form-group">
                                <label>Giới Hạn Sử Dụng</label>
                                <input type="number" id="maxUse" placeholder="Không giới hạn" min="1">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Cấp Quyền Truy Cập</label>
                            <select id="level">
                                <option value="basic">⭐ Cơ Bản — Tải tệp & lấy khóa</option>
                                <option value="premium">🌟 Nâng Cao — Tất cả chức năng</option>
                                <option value="galaxy">🌌 Vũ Trụ — Toàn quyền hệ thống</option>
                            </select>
                        </div>

                        <button type="submit" class="submit-btn">🚀 Tạo Khóa Ngay</button>
                    </form>

                    <div class="result-box" id="resultBlock">
                        <h4>✅ Khóa đã được tạo trong vũ trụ!</h4>
                        <div class="key-display" id="keyOutput">CK-XXXX-XXXX-XXXX</div>
                        <button class="copy-btn" onclick="copyKey()">📋 Sao Chép Khóa</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Tạo sao động -->
    <script>
        const container = document.getElementById('starsContainer');
        for (let i = 0; i < 180; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const s = Math.random() * 2 + 0.6;
            star.style.width = star.style.height = s + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--op', Math.random() * 0.4 + 0.15);
            star.style.setProperty('--dur', (Math.random() * 4 + 2) + 's');
            container.appendChild(star);
        }

        // ===== Xác Thực Đăng Nhập =====
        const VALID_USER = 'admin';
        const VALID_PASS = 'admin';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (user === VALID_USER && pass === VALID_PASS) {
                // Đăng nhập thành công
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminSection').classList.remove('hidden');
                document.getElementById('loginError').style.display = 'none';
            } else {
                // Sai thông tin
                document.getElementById('loginError').style.display = 'block';
            }
        });

        // Đăng xuất
        function logout() {
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('loginError').style.display = 'none';
        }

        // Tạo khóa
        function generateCosmicKey() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
            let part = () => {
                let s = '';
                for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
                return s;
            };
            return `CK-${part()}-${part()}-${part()}`;
        }

        document.getElementById('keyForm').addEventListener('submit', e => {
            e.preventDefault();
            document.getElementById('keyOutput').textContent = generateCosmicKey();
            document.getElementById('resultBlock').classList.add('show');
        });

        function copyKey() {
            const key = document.getElementById('keyOutput').textContent;
            navigator.clipboard.writeText(key).then(() => {
                alert('Đã sao chép khóa:\n' + key);
            });
        }
    </script>
</body>
</html>

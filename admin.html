<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị — SecureFlow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        :root {
            --bg: #020617;
            --surface: #111827;
            --form-bg: #1e293b;
            --accent: #facc15;
            --ok: #22c55e;
            --danger: #ef4444;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255,255,255,0.08);
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-wrap { display: flex; align-items: center; gap: 12px; }
        .logo-mark {
            width: 42px; height: 42px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--ok));
            display: grid; place-items: center;
            font-size: 18px;
            color: #000;
            font-weight: bold;
        }
        .back-btn {
            padding: 10px 20px;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); }

        main {
            max-width: 680px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .panel {
            background: var(--surface);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 50px rgba(0,0,0,0.3);
        }
        .panel h1 {
            font-size: 22px;
            margin-bottom: 8px;
            display: flex; align-items: center; gap: 10px;
        }
        .panel h1 span { color: var(--accent); }
        .panel p { color: var(--muted); margin-bottom: 30px; font-size: 14px; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 18px;
        }
        @media (max-width: 520px) {
            .form-grid { grid-template-columns: 1fr; }
        }
        .form-full { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }
        input, select, textarea {
            width: 100%;
            padding: 13px 16px;
            background: var(--form-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: var(--accent); }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, var(--accent), #eab308);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }
        .submit-btn:hover { transform: translateY(-2px); }

        .result {
            margin-top: 30px;
            padding: 24px;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 12px;
            display: none;
        }
        .result.show { display: block; }
        .result h4 { color: var(--ok); margin-bottom: 12px; font-size: 15px; }
        .key-box {
            background: rgba(0,0,0,0.25);
            padding: 14px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 15px;
            color: #86efac;
            margin-bottom: 12px;
            word-break: break-all;
        }
        .copy-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <header>
        <div class="logo-wrap">
            <div class="logo-mark">⚙️</div>
            <div>
                <h3>SecureFlow</h3>
                <p style="font-size:11px; color:var(--muted)">Bảng Điều Khiển Quản Lý</p>
            </div>
        </div>
        <a href="index.html" class="back-btn">← Trở Về Trang Chủ</a>
    </header>

    <main>
        <div class="panel">
            <h1><span>🔑</span> Tạo Khóa Truy Cập Mới</h1>
            <p>Điền thông tin → tạo ngay → phân phối cho người dùng</p>

            <form id="genForm">
                <div class="form-full">
                    <label>Tên / Mô tả khóa</label>
                    <input type="text" id="desc" placeholder="VD: Mod Game FF — Tài khoản ABC" required>
                </div>

                <div class="form-grid">
                    <div>
                        <label>Ngày hết hạn</label>
                        <input type="date" id="expDate">
                    </div>
                    <div>
                        <label>Số lần dùng tối đa</label>
                        <input type="number" id="maxUse" placeholder="Không giới hạn" min="1">
                    </div>
                </div>

                <div class="form-full">
                    <label>Phân quyền</label>
                    <select id="level">
                        <option value="user">Người dùng — Tải tệp & lấy khóa</option>
                        <option value="vip">VIP — Tất cả chức năng nâng cao</option>
                        <option value="admin">Quản trị — Toàn quyền</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">✅ Tạo Khóa Ngay</button>
            </form>

            <div class="result" id="resBlock">
                <h4>✅ Tạo thành công!</h4>
                <div class="key-box" id="keyOut">SF-XXXXXXXX</div>
                <button class="copy-btn" onclick="copyKey()">📋 Sao chép khóa</button>
            </div>
        </div>
    </main>

    <script>
        function makeKey() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
            let s = '';
            for (let i = 0; i < 8; i++) s += chars[Math.floor(Math.random() * chars.length)];
            return `SF-${s}`;
        }
        document.getElementById('genForm').addEventListener('submit', e => {
            e.preventDefault();
            document.getElementById('keyOut').textContent = makeKey();
            document.getElementById('resBlock').classList.add('show');
        });
        function copyKey() {
            const k = document.getElementById('keyOut').textContent;
            navigator.clipboard.writeText(k).then(() => alert('Đã sao chép: ' + k));
        }
    </script>
</body>
</html>
